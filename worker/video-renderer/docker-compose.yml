# Run the render worker on a Droplet (or any Docker host):
#   cp .env.example .env.worker   # then fill in RENDER_WORKER_SECRET
#   docker compose up -d --build
#   docker compose logs -f
services:
  video-worker:
    build: .
    image: rebx-video-worker:latest
    container_name: rebx-video-worker
    env_file: .env.worker
    restart: unless-stopped
    # Give an in-flight render time to stop and release its lease on shutdown.
    stop_grace_period: 30s
    # Rendering is CPU/memory heavy; keep it from starving the host.
    # Use a Droplet with more RAM than this (>= 4 GB recommended).
    mem_limit: 3g
    # Scratch space for downloaded assets and intermediate renders. This must be
    # on disk, NOT tmpfs: tmpfs lives in RAM and gets the worker OOM-killed on
    # small Droplets.
    volumes:
      - render-tmp:/var/rebx-render-tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  render-tmp:
