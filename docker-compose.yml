services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rebx_root_password
      MYSQL_DATABASE: rebx
      MYSQL_USER: rebx
      MYSQL_PASSWORD: rebx_dev_password
    ports:
      - "3306:3306"
    volumes:
      - rebx_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "rebx", "-prebx_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rebx_mysqldata:
